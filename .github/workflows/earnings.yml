name: Cache earnings dates

on:
  schedule:
    # Daily — new tickers trickle in slowly (whatever gets traded that day),
    # and each ticker is only ever fetched once (its full earnings history
    # in one call), so there's no need to run this more often.
    - cron: "45 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Cache earnings dates
        working-directory: backend/earnings
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python scan_earnings.py

      - name: Commit updated database
        # Retries and, on a clash with another workflow's push, re-applies only
        # the tables this workflow owns (a binary SQLite can't be rebased).
        run: |
          backend/tools/push_db.sh "chore: refresh earnings cache [skip ci]" earnings_cache earnings_skip
