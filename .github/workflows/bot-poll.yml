name: Poll Telegram bot commands

on:
  schedule:
    # GitHub Actions' minimum cron granularity is 5 minutes, and actual
    # firing can lag a bit under load — good enough for a free bot.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r bot/requirements.txt

      - name: Process pending Telegram commands
        working-directory: bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python commands.py

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/congress_trades.db
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: bot subscriptions update [skip ci]"
          git push
  
