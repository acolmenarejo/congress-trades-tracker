name: Poll Telegram bot commands

on:
  schedule:
    # GitHub Actions' minimum cron granularity is 5 minutes, and actual
    # firing can lag a bit under load — good enough for a free bot.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

# Pings come every 1-2 min; two overlapping runs read the same Telegram
# updates and answered /resumen twice. A `concurrency` group stopped that, but
# GitHub keeps only one pending run per group and cancels the rest, and every
# cancelled run emailed the owner (about half of all runs, Nov 2026). Instead,
# a run that finds an older one still active exits early as a success.
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skip if an older run is still active
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          older=0
          for status in queued in_progress; do
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/bot-poll.yml/runs?status=$status&per_page=50" \
              --jq "[.workflow_runs[] | select(.id < ${{ github.run_id }})] | length" || echo 0)
            older=$((older + n))
          done
          if [ "$older" -gt 0 ]; then
            echo "An older run is still active; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # A dispatched run still carries the commit it was started on, which may
      # be behind by now; check out master's tip instead, or it runs on a
      # stale DB and resends alerts the previous run already sent.
      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          ref: master

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          pip install -r backend/requirements.txt
          pip install -r bot/requirements.txt

      - name: Process pending Telegram commands
        if: steps.guard.outputs.skip != 'true'
        working-directory: bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python commands.py

      - name: Commit updated database
        if: steps.guard.outputs.skip != 'true'
        # Retries and, on a clash with another workflow's push, re-applies only
        # the tables this workflow owns (a binary SQLite can't be rebased).
        run: |
          backend/tools/push_db.sh "chore: bot subscriptions update [skip ci]" !telegram_subscribers !telegram_watches "telegram_state:key IN ('telegram_update_offset','digest_last_sent')"
