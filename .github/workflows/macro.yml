name: Refresh macro data

on:
  schedule:
    # Weekdays after the US close; FRED publishes most daily series the
    # next morning, so each run mostly picks up the previous day.
    - cron: "15 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: macro
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # A dispatched run that waited behind `concurrency` still carries the
      # commit it was started on; check out master's tip instead, or it runs
      # on a stale DB and resends alerts the previous run already sent.
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Fetch FRED and Yahoo series
        working-directory: backend/macro
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python fetch_macro.py

      - name: Commit updated database
        # Retries and, on a clash with another workflow's push, re-applies only
        # the tables this workflow owns (a binary SQLite can't be rebased).
        run: |
          backend/tools/push_db.sh "chore: refresh macro data [skip ci]" "macro_points:series NOT LIKE 'PM_%' AND series NOT LIKE 'KS_%'" "telegram_state:key = 'macro_status'"
