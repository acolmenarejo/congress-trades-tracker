name: Calculate trader rankings

on:
  schedule:
    # Once a day. Price history doesn't change intraday-meaningfully for this
    # use case, and it's the slowest job (one Yahoo Finance call per ticker).
    - cron: "30 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Calculate rankings
        working-directory: backend/ranking
        run: python calculate_rankings.py

      - name: Keep the database well under GitHub's 100 MB file limit
        run: python backend/tools/compact_db.py

      - name: Commit updated database
        # Retries and, on a clash with another workflow's push, re-applies only
        # the tables this workflow owns (a binary SQLite can't be rebased).
        run: |
          backend/tools/push_db.sh "chore: refresh trader rankings [skip ci]" member_rankings trade_returns price_cache
