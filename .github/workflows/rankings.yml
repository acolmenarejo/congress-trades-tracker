name: Calculate trader rankings

on:
  schedule:
    # Once a day. Price history doesn't change intraday-meaningfully for this
    # use case, and it's the slowest job (one Yahoo Finance call per ticker).
    - cron: "30 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Calculate rankings
        working-directory: backend/ranking
        run: python calculate_rankings.py

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/congress_trades.db
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: refresh trader rankings [skip ci]"
          git pull --rebase --autostash
          git push
