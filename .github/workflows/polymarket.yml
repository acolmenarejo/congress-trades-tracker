name: Scan Polymarket whale bets

on:
  schedule:
    # Hourly: suspicious bets are about news coming soon (markets that
    # resolve within days), so a 3h lag was too slow for the Telegram alert.
    # GitHub's schedule can lag; the scanner reads trades since the last
    # one it saw, so a late run catches up rather than missing any.
    - cron: "25 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: polymarket
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Scan Polymarket and alert
        working-directory: backend/polymarket
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scan_whale_bets.py

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/congress_trades.db
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: refresh polymarket whale alerts [skip ci]"
          git pull --rebase --autostash
          git push
