name: Scan Polymarket whale bets

on:
  schedule:
    # Every 3 hours — this is a personal watch signal, not real-time
    # trading, and Polymarket's public API has no auth/rate budget to worry
    # about here, but no need to hammer it either.
    - cron: "15 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Scan Polymarket
        working-directory: backend/polymarket
        run: python scan_whale_bets.py

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/congress_trades.db
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: refresh polymarket whale alerts [skip ci]"
          git pull --rebase --autostash
          git push
