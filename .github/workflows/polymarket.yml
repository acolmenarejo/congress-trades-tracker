name: Scan Polymarket whale bets

on:
  schedule:
    # Hourly: suspicious bets are about news coming soon (markets that
    # resolve within days), so a 3h lag was too slow for the Telegram alert.
    # GitHub's schedule can lag; the scanner reads trades since the last
    # one it saw, so a late run catches up rather than missing any.
    - cron: "25 * * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Backfill: rescan this many past hours (stored for the web, no Telegram)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: polymarket
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Scan Polymarket and alert
        working-directory: backend/polymarket
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          HOURS: ${{ inputs.hours }}
        run: python scan_whale_bets.py ${HOURS:+--hours "$HOURS"}

      - name: Commit updated database
        # Same retry/merge loop as insiders.yml: hourly now, so it races the
        # other workflows pushing the SQLite more often.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DB=backend/data/congress_trades.db
          for attempt in 1 2 3 4 5; do
            git add $DB
            git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
            git commit -q -m "chore: refresh polymarket suspicious bets [skip ci]"
            if git pull --rebase -q && git push -q; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            cp $DB /tmp/ours.db
            git fetch -q origin master
            git reset -q --hard origin/master
            python backend/tools/merge_tables.py /tmp/ours.db $DB polymarket_alerts "macro_points:series LIKE 'PM_%' OR series LIKE 'KS_%'" "telegram_state:key LIKE 'polymarket%' OR key LIKE 'kalshi%'"
            sleep $((attempt * 5))
          done
          exit 1
