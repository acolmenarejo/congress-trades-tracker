name: Scan Polymarket whale bets

on:
  schedule:
    # Hourly: suspicious bets are about news coming soon (markets that
    # resolve within days), so a 3h lag was too slow for the Telegram alert.
    # GitHub's schedule can lag; the scanner reads trades since the last
    # one it saw, so a late run catches up rather than missing any.
    - cron: "25 * * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Backfill: rescan this many past hours (stored for the web, no Telegram)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: polymarket
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      # A dispatched run that waited behind `concurrency` still carries the
      # commit it was started on; check out master's tip instead, or it runs
      # on a stale DB and resends alerts the previous run already sent.
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Scan Polymarket and alert
        working-directory: backend/polymarket
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          HOURS: ${{ inputs.hours }}
        run: python scan_whale_bets.py ${HOURS:+--hours "$HOURS"}

      - name: Commit updated database
        # Retries and, on a clash with another workflow's push, re-applies only
        # the tables this workflow owns (a binary SQLite can't be rebased).
        run: |
          backend/tools/push_db.sh "chore: refresh polymarket suspicious bets [skip ci]" polymarket_alerts "alert_outcomes:source IN ('polymarket','kalshi')" "macro_points:series LIKE 'PM_%' OR series LIKE 'KS_%'" "telegram_state:key LIKE 'polymarket%' OR key LIKE 'kalshi%'"
