name: Ingest congress trades

on:
  schedule:
    # Every 6 hours. STOCK Act disclosures don't arrive faster than that in practice.
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r bot/requirements.txt

      - name: Run ingestion
        working-directory: backend/ingestion
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python fetch_trades.py

      - name: Send Telegram alerts for new trades
        working-directory: bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python notify.py

      - name: Commit updated database
        # Retries and, on a clash with another workflow's push, re-applies only
        # the tables this workflow owns (a binary SQLite can't be rebased).
        run: |
          backend/tools/push_db.sh "chore: refresh trades data [skip ci]" members trades
