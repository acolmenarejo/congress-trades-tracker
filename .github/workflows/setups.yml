name: Scan technical setups

on:
  schedule:
    # Weekdays after the US close. GitHub's schedule can lag hours, which is
    # fine here: signals are end-of-day and meant for the next session.
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Scan setups and alert
        working-directory: backend/setups
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scan_setups.py

      - name: Commit updated database
        # Retry loop instead of a plain rebase: the scan takes minutes, so
        # another workflow often pushes the DB meanwhile, and a binary SQLite
        # can't be rebased. On conflict, take the remote DB and re-apply only
        # the tables this workflow owns (backend/tools/merge_tables.py).
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DB=backend/data/congress_trades.db
          for attempt in 1 2 3 4 5; do
            git add $DB
            git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
            git commit -q -m "chore: setup signals [skip ci]"
            if git pull --rebase -q && git push -q; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            cp $DB /tmp/ours.db
            git fetch -q origin master
            git reset -q --hard origin/master
            python backend/tools/merge_tables.py /tmp/ours.db $DB setup_signals
            sleep $((attempt * 5))
          done
          exit 1
