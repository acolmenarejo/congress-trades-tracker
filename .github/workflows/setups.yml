name: Scan technical setups

on:
  schedule:
    # Weekdays after the US close. GitHub's schedule can lag hours, which is
    # fine here: signals are end-of-day and meant for the next session.
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      # A dispatched run that waited behind `concurrency` still carries the
      # commit it was started on; check out master's tip instead, or it runs
      # on a stale DB and resends alerts the previous run already sent.
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        # matplotlib only here (alert charts), not in requirements.txt: Vercel
        # installs that file too and doesn't need it.
        run: pip install -r requirements.txt matplotlib

      - name: Scan setups and alert
        working-directory: backend/setups
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python scan_setups.py

      - name: Commit updated database
        # Retries and, on a clash with another workflow's push, re-applies only
        # the tables this workflow owns (a binary SQLite can't be rebased).
        run: |
          backend/tools/push_db.sh "chore: setup signals [skip ci]" company_profiles setup_signals
