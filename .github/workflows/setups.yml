name: Scan technical setups

on:
  schedule:
    # Weekdays after the US close. GitHub's schedule can lag hours, which is
    # fine here: signals are end-of-day and meant for the next session.
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Scan setups and alert
        working-directory: backend/setups
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scan_setups.py

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/congress_trades.db
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: setup signals [skip ci]"
          git pull --rebase --autostash
          git push
